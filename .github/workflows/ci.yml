name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# lint, typecheck, and build are hard gates (green). `test` is still
# `continue-on-error: true` while the failing-test baseline is brought up;
# remove that once the suite passes.

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      # Build/typecheck only need these present, not real.
      # Override with real secrets in your deployment pipeline.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/constituent_test
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      SKIP_ENV_VALIDATION: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
        continue-on-error: true

      - name: Build
        run: npm run build
